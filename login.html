<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SocialLune</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; background-color: #f0f0f0; }
        .login-container { background-color: white; padding: 2rem; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        input[type=text], input[type=password] { width: 100%; padding: 0.8rem; margin: 0.5rem 0; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 0.8rem 2rem; border: none; background-color: #6a0dad; color: white; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #4b0082; }
        .error { color: red; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login - SocialLune</h2>
        <input type="text" id="username" placeholder="Nome de entrada">
        <input type="password" id="password" placeholder="Senha">
        <button onclick="login()">Entrar</button>
        <div class="error" id="errorMsg"></div>
    </div>
    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if(username === 'SocialLune' && password === '1234') {
                window.location.href = 'home.html';
            } else {
                document.getElementById('errorMsg').innerText = 'Nome de entrada ou senha incorretos!';
            }
        }
    </script>
</body>
</html>
